<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Monarchs</title>
    <style>
        /* Estilos generales para ocupar toda la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        /* Configuración del video para que actúe como fondo fijo */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Evita que el video se deforme */
            z-index: -999;     /* Lo envía al fondo de todo */
        }

        /* Capa de contenido (textos y botones) flotando por encima */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            /* Una ligera capa oscura transparente para que el texto resalte sobre el video */
            background: rgba(0, 0, 0, 0.4); 
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 30px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        }

        .btn {
            background-color: #27ae60;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta videos en HTML5.
    </video>

    <div class="content">
        <h1>Silent Monarchs</h1>
        <p>"En el silencio de las sombras, forjamos nuestra leyenda en Rucoy."</p>
        <a href="#" class="btn">Reclutamiento: ABIERTO</a>
    </div>

</body>
</html>
